name: Desktop qualification
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'src/**', 'assets/**', 'bin/**', 'test/**', 'package.json', '.github/workflows/desktop.yml', '.github/workflows/provider.yml', '.github/workflows/publish.yml']
  push:
    branches: [main]
    paths: ['desktop/**', 'src/**', 'assets/**', 'bin/**', 'test/**', 'package.json', '.github/workflows/desktop.yml', '.github/workflows/provider.yml', '.github/workflows/publish.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Pinned Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - run: npm ci --prefix desktop
      - run: npm test
      - run: npm --prefix desktop test
      - name: Prepare host-specific runtime
        run: npm --prefix desktop run prepare:bundle
      - name: Native tests without a window
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Package platform installers (no signing or publication)
        run: npm --prefix desktop run build -- --ci
      - name: Packaged helper and frontend tests without a window
        run: npm --prefix desktop run test:bundle
      - name: Extracted Linux installers without a window
        if: runner.os == 'Linux'
        run: npm --prefix desktop run test:linux-packages
