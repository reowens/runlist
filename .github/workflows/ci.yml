name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# Keep this job name stable if repository rules begin requiring it.
# Native desktop builds and the broader CLI matrix are selected manually.
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6
        with:
          node-version: 26
      - name: Record tested source and tools
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'Checkout differs from event source'; exit 1; }
          echo "Source: $SOURCE_SHA"
          node --version
          npm --version
          git --version
      - run: npm run check:public
        env:
          RUNLIST_PUBLIC_CHECK_KEY: ${{ secrets.RUNLIST_PUBLIC_CHECK_KEY }}
      - run: npm test
